# Displayname template for QQ users.
#  .Alias - The alias set by me.
#  .Name - The username set by the user.
#  .ID - The internal user ID of the user.
displayname_template: '{{or .Alias .Name "Unknown user"}}'

# NapCatQQ reverse WebSocket server. Start matrix-qq first, then configure
# each NapCatQQ instance to connect to ws://matrix-qq:8080/onebot/v11/ws.
napcat:
  listen_address: 0.0.0.0:8080
  websocket_path: /onebot/v11/ws
  access_token: ""
  request_timeout: 30

reconnect:
  delay: 3
  max_times: 0 # Unlimit
  interval: 7
